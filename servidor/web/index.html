<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de tareas</title>
  <style>
    :root {
      --fondo: #f5f6f8; --tarjeta: #ffffff; --texto: #1d2330; --suave: #6b7280;
      --borde: #e2e5ea; --acento: #2563eb; --peligro: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #111418; --tarjeta: #1a1f26; --texto: #e7eaee; --suave: #9aa3af;
        --borde: #2b323c; --acento: #60a5fa; --peligro: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: var(--fondo); color: var(--texto); }
    main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 16px; }
    form { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: inherit;
      background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px;
    }
    button {
      padding: 8px 14px; font: inherit; font-size: .95rem; color: inherit; cursor: pointer;
      background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px;
    }
    button:hover { border-color: var(--suave); }
    button.principal { background: var(--acento); border-color: var(--acento); color: #fff; }
    #error { color: var(--peligro); min-height: 1.4em; margin: 8px 0 0; }
    .filtros { display: flex; gap: 6px; margin: 8px 0 12px; }
    .filtros button[aria-pressed="true"] { border-color: var(--acento); color: var(--acento); font-weight: 600; }
    ul { list-style: none; margin: 0; padding: 0; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--borde); }
    li:first-child { border-top: 0; }
    li input[type="checkbox"] { width: 18px; height: 18px; flex: none; accent-color: var(--acento); }
    li .titulo { flex: 1; overflow-wrap: anywhere; }
    li input.titulo { padding: 4px 8px; }
    li.completada span.titulo { text-decoration: line-through; color: var(--suave); }
    li button { padding: 4px 8px; font-size: .85rem; }
    .borrar { color: var(--peligro); }
    .vacio { padding: 16px; color: var(--suave); text-align: center; display: block; }
  </style>
</head>
<body>
  <main>
    <h1>Lista de tareas</h1>
    <form id="formulario">
      <input id="nueva" type="text" placeholder="¿Qué hay que hacer?" aria-label="Nueva tarea" required>
      <button class="principal">Agregar</button>
    </form>
    <p id="error" role="alert"></p>
    <div class="filtros" role="group" aria-label="Filtrar tareas">
      <button type="button" data-estado="" aria-pressed="true">Todas</button>
      <button type="button" data-estado="pendientes" aria-pressed="false">Pendientes</button>
      <button type="button" data-estado="completadas" aria-pressed="false">Completadas</button>
    </div>
    <ul id="lista"></ul>
  </main>

  <script>
    // Usa la misma API que el CLI (cliente/tareas.js), servida por servidor.py.
    const lista = document.getElementById("lista");
    const error = document.getElementById("error");
    const nueva = document.getElementById("nueva");
    let filtro = "";

    async function pedir(metodo, ruta, cuerpo) {
      let respuesta;
      try {
        respuesta = await fetch(ruta, {
          method: metodo,
          headers: { "Content-Type": "application/json" },
          body: cuerpo ? JSON.stringify(cuerpo) : undefined,
        });
      } catch {
        throw new Error("No se pudo conectar con el servidor. ¿Está corriendo? (python servidor/servidor.py)");
      }
      const texto = await respuesta.text();
      const datos = texto ? JSON.parse(texto) : null;
      if (!respuesta.ok) {
        throw new Error(datos?.error ?? `Error HTTP ${respuesta.status}`);
      }
      return datos;
    }

    // Ejecuta un cambio, muestra el error si lo hay y siempre vuelve a pintar la lista.
    async function accion(cambio) {
      error.textContent = "";
      try { await cambio(); } catch (e) { error.textContent = e.message; }
      try { await cargar(); } catch (e) { error.textContent = e.message; }
    }

    async function cargar() {
      const tareas = await pedir("GET", filtro ? `/tareas?estado=${filtro}` : "/tareas");
      if (tareas.length) {
        lista.replaceChildren(...tareas.map(crearFila));
      } else {
        const vacio = document.createElement("li");
        vacio.className = "vacio";
        vacio.textContent = `No hay tareas${filtro ? ` ${filtro}` : ""}.`;
        lista.replaceChildren(vacio);
      }
    }

    function boton(texto, alPulsar) {
      const elemento = document.createElement("button");
      elemento.type = "button";
      elemento.textContent = texto;
      elemento.addEventListener("click", alPulsar);
      return elemento;
    }

    function crearFila(tarea) {
      const fila = document.createElement("li");
      fila.classList.toggle("completada", tarea.completada);

      const casilla = document.createElement("input");
      casilla.type = "checkbox";
      casilla.checked = tarea.completada;
      casilla.setAttribute("aria-label", `Completada: ${tarea.titulo}`);
      casilla.addEventListener("change", () =>
        accion(() => pedir("PATCH", `/tareas/${tarea.id}`, { completada: casilla.checked })));

      const titulo = document.createElement("span");
      titulo.className = "titulo";
      titulo.textContent = tarea.titulo; // textContent: el título nunca se interpreta como HTML

      const editar = boton("Editar", () => editarTitulo(titulo, tarea));
      const borrar = boton("Eliminar", () => accion(() => pedir("DELETE", `/tareas/${tarea.id}`)));
      borrar.classList.add("borrar");

      fila.append(casilla, titulo, editar, borrar);
      return fila;
    }

    // Cambia el título por un campo de texto: Enter (o salir del campo) guarda, Esc cancela.
    function editarTitulo(titulo, tarea) {
      const campo = document.createElement("input");
      campo.type = "text";
      campo.className = "titulo";
      campo.value = tarea.titulo;
      campo.setAttribute("aria-label", "Nuevo título");
      let terminado = false;
      const terminar = (guardar) => {
        if (terminado) return;
        terminado = true;
        const nuevo = campo.value.trim();
        accion(guardar && nuevo !== tarea.titulo
          ? () => pedir("PATCH", `/tareas/${tarea.id}`, { titulo: nuevo })
          : () => {});
      };
      campo.addEventListener("keydown", (e) => {
        if (e.key === "Enter") terminar(true);
        if (e.key === "Escape") terminar(false);
      });
      campo.addEventListener("blur", () => terminar(true));
      titulo.replaceWith(campo);
      campo.focus();
      campo.select();
    }

    document.getElementById("formulario").addEventListener("submit", (e) => {
      e.preventDefault();
      accion(async () => {
        await pedir("POST", "/tareas", { titulo: nueva.value });
        nueva.value = "";
      });
    });

    for (const opcion of document.querySelectorAll(".filtros button")) {
      opcion.addEventListener("click", () => {
        filtro = opcion.dataset.estado;
        for (const otro of document.querySelectorAll(".filtros button")) {
          otro.setAttribute("aria-pressed", String(otro === opcion));
        }
        accion(() => {});
      });
    }

    accion(() => {});
  </script>
</body>
</html>
